<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
      }
      .user-info {
        border: 1px solid #ddd;
        padding: 20px;
        border-radius: 5px;
        margin-bottom: 20px;
      }
      img {
        width: 100px;
        border-radius: 50%;
      }
      button {
        padding: 10px 20px;
        background-color: #dc3545;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Dashboard</h1>
    <div class="user-info">
      <img id="userPicture" src="" alt="Foto do usuário" />
      <p><strong>Nome:</strong> <span id="userName"></span></p>
      <p><strong>Email:</strong> <span id="userEmail"></span></p>
    </div>
    <button onclick="logout()">Logout</button>

    <script src="dashboard.js"></script>
  </body>
</html>
